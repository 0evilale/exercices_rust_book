[package]
name = "obs_pipeline"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "obs_pipeline"
path = "src/main.rs"

[dependencies]
# Screen capture (X11/Wayland/macOS/Windows)
scap = "0.0.8"

# Preview window + CPU framebuffer
winit = "0.30"
softbuffer = "0.4"

# Error types
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# Slight optimisation so BGRA blending isn't unusably slow in debug builds
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
